<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
:root {
    --bg: #16201D;
    --row: #1E2B27;
    --line: #223029;
    --text: #E8F5F1;
    --muted: #8FA39C;
    --accent: #3DD6B0;
}
* { box-sizing: border-box; }
html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", system-ui, sans-serif;
    user-select: none;
    overflow: hidden;
}
[hidden] { display: none !important; }
.popup {
    height: 100%;
    border: 1px solid var(--line);
}
.page {
    display: flex;
    flex-direction: column;
    height: 100%;
}
header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 20px 22px;
    border-bottom: 1px solid var(--line);
}
header img { width: 40px; height: 40px; }
.title { flex: 1; }
h1 { margin: 0; font-size: 24px; line-height: 1.1; }
.status { margin-top: 4px; font-family: Consolas, monospace; font-size: 13px; color: var(--muted); }
.switch {
    position: relative;
    width: 52px;
    height: 28px;
    border-radius: 14px;
    background: var(--line);
    border: 0;
    cursor: pointer;
    padding: 0;
}
.switch::after {
    content: "";
    position: absolute;
    top: 4px;
    left: 4px;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: var(--text);
    transition: left .15s;
}
.switch.on { background: var(--accent); }
.switch.on::after { left: 28px; background: var(--bg); }
footer {
    margin-top: auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 14px;
}
footer button {
    background: none;
    border: 0;
    border-radius: 6px;
    color: var(--text);
    font-size: 14px;
    padding: 10px 14px;
    cursor: pointer;
    font-family: inherit;
}
footer .quit { color: var(--muted); }
footer button:hover { background: var(--row); }
footer .quit:hover { color: var(--text); }
footer button:active { opacity: .7; }
.switch:hover { filter: brightness(1.15); }
footer button, .switch { transition: background .12s, color .12s; }
.back {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 12px 14px;
    border-bottom: 1px solid var(--line);
}
.back button {
    background: none;
    border: 0;
    border-radius: 6px;
    color: var(--muted);
    font-size: 18px;
    padding: 2px 10px;
    cursor: pointer;
}
.back button:hover { background: var(--row); color: var(--text); }
.back h2 { margin: 0; font-size: 18px; }
.setting {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 22px;
    border-bottom: 1px solid var(--line);
    font-size: 15px;
}
select {
    color-scheme: dark;
    background: #111917;
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 7px 10px;
    font-family: inherit;
    font-size: 14px;
    cursor: pointer;
}
select:hover { border-color: var(--accent); }
</style>
</head>
<body>
<div class="popup">
<section class="page" id="home">
    <header>
        <img src="{{LOGO}}" alt="Snipy Icon">
        <div class="title">
            <h1>Snipy</h1>
            <div class="status" id="status"></div>
        </div>
        <button class="switch" id="toggle" aria-label="Toggle auto-copy"></button>
    </header>
    <footer>
        <button id="open-settings">Settings</button>
        <button class="quit" id="quit">Quit</button>
    </footer>
</section>
<section class="page" id="settings" hidden>
    <div class="back">
        <button id="back" aria-label="Back">&#8249;</button>
        <h2>Settings</h2>
    </div>
    <label class="setting">Trigger
        <select id="trigger">
            <option value="0">Drag or double-click</option>
            <option value="1">Drag</option>
            <option value="2">Double-click</option>
        </select>
    </label>
    <label class="setting">Minimum length
        <select id="minlen">
            <option value="1">1 character</option>
            <option value="2">2 characters</option>
            <option value="3">3 characters</option>
            <option value="5">5 characters</option>
        </select>
    </label>
</section>
</div>

<script>
const toggle = document.getElementById("toggle");
const status = document.getElementById("status");
const send = (msg) => window.ipc.postMessage(msg);

const home = document.getElementById("home");
const settings = document.getElementById("settings");
const trigger = document.getElementById("trigger");
const minlen = document.getElementById("minlen");

function render(state) {
    toggle.classList.toggle("on", state.enabled);
    status.textContent = "auto-copy is " + (state.enabled ? "on" : "off");
    trigger.value = state.trigger;
    minlen.value = state.minlen;
}

function show(page) {
    home.hidden = page !== "home";
    settings.hidden = page !== "settings";
}

toggle.addEventListener("click", () => {
    const enabled = !toggle.classList.contains("on");
    send("enabled:" + enabled);
    toggle.classList.toggle("on", enabled);
    status.textContent = "auto-copy is " + (enabled ? "on" : "off");
});
document.getElementById("open-settings").addEventListener("click", () => show("settings"));
document.getElementById("back").addEventListener("click", () => show("home"));
trigger.addEventListener("change", () => send("trigger:" + trigger.value));
minlen.addEventListener("change", () => send("minlen:" + minlen.value));
document.getElementById("quit").addEventListener("click", () => send("quit"));
render({ enabled: true, trigger: 0, minlen: 1 });
</script>
</body>
</html>
