<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Snipy Promo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Space+Grotesk:wght@500;700&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
           width: min(100vw, 177.78vh); height: min(56.25vw, 100vh); }
  #play { position: absolute; inset: 0; display: grid; place-items: center; cursor: pointer;
          font: 700 28px "Space Grotesk", sans-serif; color: #3DD6B0; letter-spacing: 6px; }
  #play span { padding: 22px 44px; border: 2px solid #3DD6B0; border-radius: 999px; background: rgba(6,8,11,.7); }
  body.render #play { display: none; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<div id="play"><span>▶ PLAY</span></div>
<audio id="music" src="music.wav" preload="auto"></audio>
<script>
const W = 1920, H = 1080, DUR = 52;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const buf = document.createElement('canvas'); buf.width = W; buf.height = H; const bctx = buf.getContext('2d');
const C = { bg: '#06080B', teal: '#3DD6B0', tealD: '#1E8C72', pink: '#FF4F81', amber: '#FFC857', blue: '#7AA2F7',
            ink: '#E8F1EE', dim: '#7C8A90', panel: '#0E141A', line: '#1F2A33' };
const DISPLAY = '"Space Grotesk", sans-serif', MONO = '"JetBrains Mono", monospace';

// ---------- math ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const P = (t, a, b) => clamp((t - a) / (b - a));
const E = {
  out3: x => 1 - Math.pow(1 - x, 3), in3: x => x * x * x,
  io3: x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2,
  outExpo: x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x), inExpo: x => x <= 0 ? 0 : Math.pow(2, 10 * x - 10),
  outBack: x => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); },
};
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const beatPulse = (t, period = .5, decay = 9) => Math.exp(-(((t % period) + period) % period) * decay);
const bump = (t, at, dur) => Math.sin(clamp((t - at) / dur) * Math.PI);   // 0 → 1 → 0

// ---------- drawing helpers ----------
function txt(s, x, y, o = {}) {
  const { size = 48, font = DISPLAY, weight = 700, color = C.ink, align = 'center', base = 'middle', alpha = 1, ls = 0 } = o;
  if (alpha <= 0) return;
  ctx.save(); ctx.globalAlpha *= alpha; ctx.font = `${weight} ${size}px ${font}`; ctx.fillStyle = color;
  ctx.textAlign = align; ctx.textBaseline = base; ctx.letterSpacing = ls + 'px'; ctx.fillText(s, x, y); ctx.restore();
}
function measure(s, size, font = DISPLAY, weight = 700, ls = 0) {
  ctx.save(); ctx.font = `${weight} ${size}px ${font}`; ctx.letterSpacing = ls + 'px'; const w = ctx.measureText(s).width; ctx.restore(); return w;
}
function glitchTxt(s, x, y, o, amt) {
  if (amt > 0.3) { ctx.save(); ctx.globalCompositeOperation = 'lighter';
    txt(s, x - amt, y, { ...o, color: '#ff2a6d', alpha: (o.alpha ?? 1) * .85 }); txt(s, x + amt, y + amt * .3, { ...o, color: '#21e6ff', alpha: (o.alpha ?? 1) * .85 }); ctx.restore(); }
  txt(s, x, y, o);
}
function rrect(x, y, w, h, r, fill, stroke, lw = 2) {
  ctx.beginPath(); ctx.roundRect(x, y, w, h, r);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
}
function key(x, y, w, h, label, press = 0, { alpha = 1, accent = false, scale = 1, rot = 0 } = {}) {
  if (alpha <= 0) return;
  ctx.save(); ctx.globalAlpha *= alpha; ctx.translate(x, y); ctx.rotate(rot); ctx.scale(scale, scale);
  const d = 12 * (1 - press) + 2;
  rrect(-w / 2, -h / 2 + 10, w, h, 18, accent ? '#156b57' : '#11161c');
  rrect(-w / 2, -h / 2 + 10 - d, w, h, 18, accent ? C.teal : '#262f39', accent ? 'rgba(255,255,255,.35)' : 'rgba(255,255,255,.12)', 2);
  txt(label, 0, 10 - d, { size: h * .3, font: MONO, color: accent ? '#032a20' : C.ink });
  ctx.restore();
}
function arrowCursor(x, y, s = 1, alpha = 1) {
  if (alpha <= 0) return;
  ctx.save(); ctx.globalAlpha *= alpha; ctx.translate(x, y); ctx.scale(s, s);
  ctx.beginPath(); [[0, 0], [0, 34], [9, 26], [15, 40], [21, 37], [15, 24], [27, 24]].forEach(([a, b], i) => i ? ctx.lineTo(a, b) : ctx.moveTo(a, b));
  ctx.closePath(); ctx.fillStyle = '#fff'; ctx.fill(); ctx.lineWidth = 2.5; ctx.strokeStyle = '#000'; ctx.stroke(); ctx.restore();
}
function ibeam(x, y, h = 40, alpha = 1) {
  if (alpha <= 0) return;
  ctx.save(); ctx.globalAlpha *= alpha; ctx.lineCap = 'round';
  for (const [col, lw] of [['#000', 7], ['#fff', 3]]) {
    ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.beginPath();
    ctx.moveTo(x, y - h / 2); ctx.lineTo(x, y + h / 2);
    ctx.moveTo(x - 8, y - h / 2); ctx.lineTo(x + 8, y - h / 2); ctx.moveTo(x - 8, y + h / 2); ctx.lineTo(x + 8, y + h / 2); ctx.stroke();
  }
  ctx.restore();
}
function ripple(x, y, t, at, color = C.teal) {
  const p = P(t, at, at + .45); if (p <= 0 || p >= 1) return;
  ctx.save(); ctx.globalAlpha = 1 - p; ctx.strokeStyle = color; ctx.lineWidth = 4 * (1 - p) + 1;
  ctx.beginPath(); ctx.arc(x, y, 8 + 50 * E.out3(p), 0, Math.PI * 2); ctx.stroke(); ctx.restore();
}
function win(x, y, w, h, title, alpha = 1) {
  ctx.save(); ctx.globalAlpha *= alpha;
  ctx.shadowColor = 'rgba(0,0,0,.6)'; ctx.shadowBlur = 60; ctx.shadowOffsetY = 20;
  rrect(x, y, w, h, 14, C.panel); ctx.shadowColor = 'transparent';
  rrect(x, y, w, h, 14, null, C.line, 2);
  ctx.save(); ctx.beginPath(); ctx.roundRect(x, y, w, 48, [14, 14, 0, 0]); ctx.fillStyle = '#121a21'; ctx.fill(); ctx.restore();
  ctx.fillStyle = C.line; ctx.fillRect(x, y + 48, w, 2);
  txt(title, x + 22, y + 25, { size: 18, font: MONO, weight: 400, color: C.dim, align: 'left' });
  ctx.strokeStyle = C.dim; ctx.lineWidth = 1.6; const cx = x + w - 30;
  ctx.beginPath(); ctx.moveTo(cx - 6, y + 19); ctx.lineTo(cx + 6, y + 31); ctx.moveTo(cx + 6, y + 19); ctx.lineTo(cx - 6, y + 31);
  ctx.strokeRect(cx - 56, y + 19, 12, 12); ctx.moveTo(cx - 106, y + 25); ctx.lineTo(cx - 94, y + 25); ctx.stroke();
  ctx.restore();
}

// ---------- the crab ----------
const CRAB = [[40,140,240,100],[50,240,30,40],[100,240,30,40],[190,240,30,40],[240,240,30,40],
  [80,110,50,30],[60,80,50,30],[40,50,50,30],[30,30,30,20],[190,110,50,30],[210,80,50,30],[230,50,50,30],[260,30,30,20]];
const EYES = [[80,160,40,40],[200,160,40,40]];
const groupOf = i => i === 0 ? 'body' : i <= 4 ? 'leg' + i : i <= 8 ? 'armL' : 'armR';
const CELLS = (() => {
  const r = rng(42), cells = [];
  CRAB.forEach(([x, y, w, h], ri) => {
    for (let cy = y; cy < y + h; cy += 10) for (let cx = x; cx < x + w; cx += 10) {
      const a = r() * Math.PI * 2, d = 500 + r() * 900;
      const dist = Math.hypot(cx - 160, cy - 155) / 180;
      cells.push({ x: cx, y: cy, sx: cx + Math.cos(a) * d, sy: cy + Math.sin(a) * d, rot: (r() - .5) * 12,
                   delay: clamp(dist * .55 + r() * .35), eye: false });
    }
  });
  return cells;
})();
function crabXform(group, arm, leg, legAmp) {
  if (group === 'armL') { ctx.translate(110, 140); ctx.rotate(-arm); ctx.translate(-110, -140); }
  else if (group === 'armR') { ctx.translate(210, 140); ctx.rotate(arm); ctx.translate(-210, -140); }
  else if (group.startsWith('leg')) { const i = +group.slice(3); ctx.translate(0, -Math.max(0, Math.sin(leg + (i % 2) * Math.PI)) * legAmp); }
}
function crab(o) {
  const { x, y, s, assemble = 1, arm = 0, leg = 0, legAmp = 0, blink = 0, alpha = 1, glow = 0, color = C.teal, rot = 0 } = o;
  if (alpha <= 0) return;
  ctx.save(); ctx.globalAlpha *= alpha; ctx.translate(x, y); ctx.rotate(rot); ctx.scale(s, s); ctx.translate(-160, -155);
  if (assemble < 1) {
    ctx.fillStyle = color;
    for (const c of CELLS) {
      const p = E.out3(clamp((assemble - c.delay * .55) / .45)); if (p <= 0) continue;
      ctx.save(); ctx.globalAlpha *= Math.min(1, p * 2.5);
      ctx.translate(lerp(c.sx, c.x, p) + 5, lerp(c.sy, c.y, p) + 5); ctx.rotate(c.rot * (1 - p));
      const sz = 10 + (1 - p) * 6; ctx.fillRect(-sz / 2, -sz / 2, sz + .6, sz + .6); ctx.restore();
    }
  } else {
    if (glow > 0) { ctx.shadowColor = color; ctx.shadowBlur = 50 * glow; }
    ctx.fillStyle = color;
    CRAB.forEach(([rx, ry, rw, rh], i) => { ctx.save(); crabXform(groupOf(i), arm, leg, legAmp); ctx.fillRect(rx, ry, rw + .5, rh + .5); ctx.restore(); });
    ctx.shadowColor = 'transparent';
  }
  const eyeA = clamp((assemble - .85) / .15);
  if (eyeA > 0) {
    ctx.globalAlpha *= eyeA; ctx.fillStyle = '#05080a';
    EYES.forEach(([ex, ey, ew, eh]) => { const hh = eh * (1 - .9 * blink); ctx.fillRect(ex, ey + (eh - hh) / 2, ew, hh); });
    ctx.fillStyle = 'rgba(255,255,255,.85)';
    EYES.forEach(([ex, ey]) => { if (blink < .5) ctx.fillRect(ex + 24, ey + 6, 10, 10); });
  }
  ctx.restore();
}
const snip = (t, times, amp = .35, dur = .22) => times.reduce((a, at) => a + bump(t, at, dur) * amp, 0);
const blinkAt = (t, times) => times.reduce((a, at) => Math.max(a, bump(t, at, .18)), 0);

// ---------- background / post ----------
function bg(t, gx = 960, gy = 540, gc = '61,214,176', ga = .12, dots = .06) {
  ctx.fillStyle = C.bg; ctx.fillRect(-60, -60, W + 120, H + 120);
  if (ga > 0) { const g = ctx.createRadialGradient(gx, gy, 0, gx, gy, 950);
    g.addColorStop(0, `rgba(${gc},${ga})`); g.addColorStop(1, `rgba(${gc},0)`); ctx.fillStyle = g; ctx.fillRect(-60, -60, W + 120, H + 120); }
  if (dots > 0) { ctx.fillStyle = `rgba(255,255,255,${dots})`; const off = (t * 24) % 48;
    for (let y = -48 + off; y < H + 48; y += 48) for (let x = 12; x < W; x += 48) ctx.fillRect(x, y, 2, 2); }
}
const GRAIN = [0, 1, 2, 3].map(k => { const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d'), d = g.createImageData(256, 256), r = rng(100 + k);
  for (let i = 0; i < d.data.length; i += 4) { const v = r() * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; }
  g.putImageData(d, 0, 0); return c; });
const IMPACTS = [[3, 16], [7.6, 9], [7.85, 9], [12, 10], [14, 24], [17.15, 4], [26, 12], [36, 8], [44, 22], [45, 22], [45.3, 14], [46, 22], [47, 12]];
const FLASHES = [[3, .45, '61,214,176'], [14, 1, '255,255,255'], [26, .35, '61,214,176'], [36, .25, '255,255,255'], [44, .7, '255,255,255'], [46, .5, '255,255,255'], [47, .4, '61,214,176']];
function shake(T) {
  let x = 0, y = 0;
  for (const [at, a] of IMPACTS) { const d = T - at; if (d < 0 || d > .6) continue;
    const k = a * Math.exp(-d * 10); x += Math.sin(d * 97) * k; y += Math.cos(d * 83) * k; }
  return [x, y];
}
function post(T, frame) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  for (const [at, a, c] of FLASHES) { const d = T - at; if (d < 0 || d > 1) continue;
    ctx.fillStyle = `rgba(${c},${a * Math.exp(-d * 7)})`; ctx.fillRect(0, 0, W, H); }
  const v = ctx.createRadialGradient(W / 2, H / 2, H * .35, W / 2, H / 2, H * 1.05);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.65)'); ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.globalAlpha = .055; ctx.globalCompositeOperation = 'overlay';
  const pat = ctx.createPattern(GRAIN[frame % 4], 'repeat'); const r = rng(frame);
  ctx.translate(-r() * 256, -r() * 256); ctx.fillStyle = pat; ctx.fillRect(0, 0, W + 256, H + 256); ctx.restore();
  const fade = Math.max(1 - P(T, 0, .35), P(T, 51.1, 51.9));
  if (fade > 0) { ctx.fillStyle = `rgba(0,0,0,${fade})`; ctx.fillRect(0, 0, W, H); }
}

// =====================================================================
// SCENE 1 · 0–6 · pixels assemble the crab, logo lands
// =====================================================================
const BURST = (() => { const r = rng(9); return Array.from({ length: 70 }, () => ({ a: r() * Math.PI * 2, v: 300 + r() * 900, s: 6 + r() * 14 })); })();
function s1(t) {
  bg(t, 960, 430, '61,214,176', .05 + .12 * P(t, .6, 3) + .25 * Math.exp(-Math.max(0, t - 3) * 2) * (t > 3), .05 * P(t, .3, 2));
  const zoom = 1 + .7 * E.inExpo(P(t, 5.45, 6)), fade = 1 - P(t, 5.7, 6);
  ctx.save(); ctx.translate(960, 500); ctx.scale(zoom, zoom); ctx.translate(-960, -500); ctx.globalAlpha = fade;

  if (t < .9 && Math.floor(t * 5) % 2 === 0) { ctx.fillStyle = C.teal; ctx.fillRect(952, 422, 16, 16); }
  // shockwave + burst
  const sp = P(t, 3, 4.2);
  if (sp > 0 && sp < 1) {
    ctx.save(); ctx.strokeStyle = C.teal; ctx.globalAlpha *= 1 - sp; ctx.lineWidth = 10 * (1 - sp);
    ctx.beginPath(); ctx.arc(960, 430, 120 + 1300 * E.out3(sp), 0, 7); ctx.stroke();
    ctx.lineWidth = 3 * (1 - sp); ctx.beginPath(); ctx.arc(960, 430, 80 + 800 * E.out3(sp), 0, 7); ctx.stroke(); ctx.restore();
    ctx.fillStyle = C.teal;
    for (const b of BURST) { const d = E.out3(sp) * b.v, a = (1 - sp);
      ctx.globalAlpha = fade * a; ctx.fillRect(960 + Math.cos(b.a) * d - b.s / 2, 430 + Math.sin(b.a) * d - b.s / 2, b.s * a, b.s * a); }
    ctx.globalAlpha = fade;
  }
  const asm = E.io3(P(t, .6, 3));
  const land = E.outBack(P(t, 2.85, 3.3));
  crab({ x: 960, y: 430, s: 1.5 + .06 * (1 - land) * (t > 2.85) + .03 * beatPulse(t - 3, 1, 6) * (t > 3.5),
         assemble: asm, arm: snip(t, [3.0, 4.6, 4.85, 5.45], .38), blink: blinkAt(t, [4.1]), glow: t > 3 ? .6 + .4 * Math.exp(-(t - 3) * 2) : 0 });
  // wordmark
  const word = 'SNIPY', size = 200, ls = 34; let total = 0; const ws = [...word].map(ch => { const w = measure(ch, size); total += w + ls; return w; });
  let x = 960 - (total - ls) / 2;
  [...word].forEach((ch, i) => {
    const p = P(t, 3.1 + i * .07, 3.55 + i * .07);
    glitchTxt(ch, x + ws[i] / 2, 790 + (1 - E.outBack(p)) * 140, { size, align: 'center', alpha: clamp(p * 3) }, 10 * (1 - p) + 2 * beatPulse(t, 1, 8));
    x += ws[i] + ls;
  });
  // tagline types out
  const tag = "highlight it. it's already copied.", n = Math.floor(tag.length * P(t, 4.05, 5.0));
  const tw = measure(tag, 34, MONO, 400);
  txt(tag.slice(0, n), 960 - tw / 2, 925, { size: 34, font: MONO, weight: 400, color: C.dim, align: 'left', alpha: P(t, 4, 4.1) });
  if (t > 4 && Math.floor(t * 4) % 2 === 0) { ctx.fillStyle = C.teal; ctx.fillRect(960 - tw / 2 + measure(tag.slice(0, n), 34, MONO, 400) + 4, 905, 18, 38); }
  ctx.restore();
}

// =====================================================================
// SCENE 2 · 6–14 · the old way: Ctrl+C forever
// =====================================================================
const OLD = ['The API key is in the wiki, under Setup.', 'Deploy target: prod-eu-west-2', 'Copy this. Paste it there. Copy that...', '...and repeat. Forever.'];
const TILES = (() => { const r = rng(5), out = []; let n = 0;
  [8.5, 9, 9.5, 10, 10.5, 11, 11.5].forEach((bt, k) => { const cnt = 2 ** (k + 1);
    for (let i = n; i < cnt; i++) out.push({ at: bt + (i - n) / (cnt - n) * .18, x: r() * W, y: 60 + r() * (H - 120), rot: (r() - .5) * .7, s: .45 + r() * .55, accent: r() < .18 });
    n = cnt; });
  return out; })();
function s2(t) {
  bg(t, 960, 540, '255,79,129', .07 + .1 * P(t, 8.5, 12), .05);
  const ws = E.out3(P(t, 6, 6.5));
  txt('// THE OLD WAY', 120, 100, { size: 26, font: MONO, weight: 700, color: C.pink, align: 'left', ls: 6, alpha: P(t, 6.1, 6.4) });
  ctx.save(); ctx.translate(960, 430); ctx.scale(.92 + .08 * ws, .92 + .08 * ws); ctx.translate(-960, -430);
  win(460, 210, 1000, 420, 'notes.txt — Notepad', ws);
  ctx.font = `400 30px ${MONO}`; const cw = ctx.measureText('M').width, x0 = 510, y0 = 320, lh = 72;
  const selP = P(t, 6.6, 7.3), sFrom = 15, sTo = 15 + 14 * E.io3(selP);
  if (selP > 0) { ctx.fillStyle = 'rgba(122,162,247,.45)'; ctx.fillRect(x0 + sFrom * cw, y0 + lh - 22, (sTo - sFrom) * cw, 46); }
  OLD.forEach((l, i) => txt(l, x0, y0 + i * lh, { size: 30, font: MONO, weight: 400, color: i === 3 ? C.dim : C.ink, align: 'left', alpha: ws }));
  // cursor
  let cx, cy; if (t < 6.6) { const p = E.io3(P(t, 6.2, 6.55)); cx = lerp(1300, x0 + sFrom * cw, p); cy = lerp(600, y0 + lh, p); }
  else { cx = x0 + sTo * cw; cy = y0 + lh; }
  if (t < 8.6) ibeam(cx, cy, 40, ws);
  ripple(cx, cy, t, 6.6, C.blue); ripple(cx, cy, t, 7.3, C.blue);
  ctx.restore();
  // the two keys
  const kA = (at) => ({ s: lerp(2, 1, E.outExpo(P(t, at, at + .14))), a: P(t, at, at + .05), pr: bump(t, at + .1, .3) });
  const k1 = kA(7.6), k2 = kA(7.85);
  key(830, 800, 250, 130, 'CTRL', k1.pr, { alpha: k1.a, scale: k1.s });
  txt('+', 1010, 800, { size: 70, color: C.dim, alpha: k2.a });
  key(1110, 800, 140, 130, 'C', k2.pr, { alpha: k2.a, scale: k2.s, accent: true });
  // multiplication chaos
  for (const tl of TILES) {
    if (t < tl.at) continue; const p = E.outExpo(P(t, tl.at, tl.at + .15)), pr = bump(t, tl.at + .08, .2);
    ctx.save(); ctx.translate(tl.x, tl.y); ctx.rotate(tl.rot); ctx.scale(tl.s * lerp(1.8, 1, p), tl.s * lerp(1.8, 1, p));
    key(-90, 0, 170, 100, 'CTRL', pr, { alpha: P(t, tl.at, tl.at + .04) }); key(70, 0, 100, 100, 'C', pr, { alpha: P(t, tl.at, tl.at + .04), accent: tl.accent });
    ctx.restore();
  }
  const k = [8.5, 9, 9.5, 10, 10.5, 11, 11.5].filter(b => t >= b).length;
  if (k > 0 && t < 12) {
    const label = t >= 11.75 ? '×∞' : '×' + (2 ** k).toLocaleString('en');
    const pp = beatPulse(t - 8.5, .5, 10);
    ctx.save(); ctx.fillStyle = 'rgba(6,8,11,.75)'; ctx.fillRect(0, 440, W, 200); ctx.restore();
    glitchTxt('Ctrl + C  ' + label, 960, 540, { size: 130 + 20 * pp, color: C.ink }, 4 + 14 * pp * (k / 7));
  }
  // FREEZE
  if (t >= 12) {
    bctx.clearRect(0, 0, W, H); bctx.drawImage(cv, 0, 0);
    ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.filter = `grayscale(1) blur(${3 * P(t, 12, 12.6)}px) brightness(${1 - .55 * P(t, 12, 12.4)})`;
    ctx.drawImage(buf, 0, 0); ctx.filter = 'none';
    if (t < 12.35) { const r = rng(Math.floor(t * 60)); for (let i = 0; i < 9; i++) { const y = r() * H, h = 10 + r() * 70, dx = (r() - .5) * 160;
      ctx.drawImage(buf, 0, y, W, h, dx, y, W, h); } }
    ctx.restore();
    const msg = "THERE'S A BETTER WAY.", n = Math.floor(msg.length * P(t, 12.3, 13.1));
    glitchTxt(msg.slice(0, n), 960, 540, { size: 120 }, 3 + 8 * bump(t, 13.3, .4));
    const sel = P(t, 13.2, 13.6);

  ic.forEach((x, i) => { if (i === 0) { ctx.fillStyle = '#4cc2ff'; [[0, 0], [12, 0], [0, 12], [12, 12]].forEach(([a, b]) => ctx.fillRect(x - 12 + a, TBY + 24 + b, 11, 11)); }
    else rrect(x - 14, TBY + 22, 28, 28, 7, ['', '#3a4450', '#e8a33d', '#3d7bd6', '#5b5f66'][i]); });
  // tray
  const trayX = 1640, trayY = TBY + 36;
  txt('⌃', 1590, trayY + 2, { size: 22, font: MONO, color: '#c8d0d6' });
  const ring = beatPulse(t - 42, 1, 3) * (t > 41.6);
  if (ring > 0) { ctx.strokeStyle = `rgba(61,214,176,${ring * .8})`; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(trayX, trayY, 18 + (1 - ring) * 22, 0, 7); ctx.stroke(); }
  crab({ x: trayX, y: trayY, s: .09, glow: .4 + .4 * ring, blink: blinkAt(t, [43.2]) });
  txt('ENG', 1700, trayY, { size: 15, font: MONO, weight: 400, color: '#c8d0d6' });
  txt('15:08', 1810, trayY - 11, { size: 15, font: MONO, weight: 400, color: '#e5e9ec' });
  txt('06.10.2026', 1810, trayY + 12, { size: 15, font: MONO, weight: 400, color: '#e5e9ec' });
  // cursor + tooltip + menu
  const cm = E.io3(P(t, 41.6, 42.1)); let cx = lerp(1300, trayX + 4, cm), cy = lerp(760, trayY + 4, cm);
  const menuP = E.outExpo(P(t, 42.75, 43.0));
  if (t > 43.05) { const m2 = E.io3(P(t, 43.05, 43.4)); cx = lerp(trayX + 4, trayX - 80, m2); cy = lerp(trayY + 4, TBY - 104, m2); }
  const tip = P(t, 42.15, 42.25) * (1 - P(t, 42.7, 42.75));
  if (tip > 0) { ctx.save(); ctx.globalAlpha = tip; rrect(trayX - 45, TBY - 52, 90, 38, 8, '#2b3038', 'rgba(255,255,255,.1)', 1);
    txt('Snipy', trayX, TBY - 33, { size: 17, font: DISPLAY, weight: 500 }); ctx.restore(); }
  if (menuP > 0) { ctx.save(); ctx.globalAlpha = menuP; ctx.translate(0, (1 - menuP) * 20);
    const mx = trayX - 210, my = TBY - 150, hov = t > 43.4;
    ctx.shadowColor = 'rgba(0,0,0,.5)'; ctx.shadowBlur = 30; rrect(mx, my, 200, 124, 10, '#2b3038', 'rgba(255,255,255,.1)', 1); ctx.shadowColor = 'transparent';
    if (hov) rrect(mx + 6, my + 8, 188, 50, 6, 'rgba(255,255,255,.08)');
    txt('Settings', mx + 24, my + 33, { size: 19, weight: 500, align: 'left' });
    txt('Quit', mx + 24, my + 91, { size: 19, weight: 500, align: 'left' });
    ctx.restore(); }
  arrowCursor(cx, cy, 1.1, P(t, 41.5, 41.7));
  ripple(cx, cy, t, 42.7, C.ink);
  if (t > 43.55) { ctx.fillStyle = `rgba(6,8,11,${E.in3(P(t, 43.55, 44))})`; ctx.fillRect(-60, -60, W + 120, H + 120); }
}

// =====================================================================
// SCENE 6 · 44–52 · SELECT. SNIP. DONE. + lockup
// =====================================================================
const DUST = (() => { const r = rng(3); return Array.from({ length: 60 }, () => ({ x: r() * W, y: r() * H, v: 10 + r() * 30, s: 3 + r() * 7, ph: r() * 6 })); })();
function s6(t) {
  if (t < 47) {
    const i = Math.floor(t - 44), at = 44 + i, p = E.outExpo(P(t, at, at + .3)), sc = lerp(1.35, 1, p) + .03 * (t - at);
    const inv = i === 1;
    ctx.fillStyle = inv ? C.teal : C.bg; ctx.fillRect(-60, -60, W + 120, H + 120);
    if (!inv) bg(t, 960, 540, '61,214,176', .14, .05);
    const word = ['SELECT.', 'SNIP.', 'DONE.'][i], col = inv ? '#04140f' : i === 0 ? C.teal : C.ink;
    ctx.save(); ctx.translate(960, 540); ctx.scale(sc, sc);
    if (i === 1) {
      // the slice
      const cut = P(t, 45.2, 45.32), sep = E.out3(P(t, 45.3, 45.9)) * 34;
      const ang = -.22, nx = -Math.sin(ang), ny = Math.cos(ang);
      for (const side of [-1, 1]) {
        ctx.save(); ctx.beginPath();
        if (side < 0) { ctx.moveTo(-1200, -1200); ctx.lineTo(1200, -1200); ctx.lineTo(1200, 1200 * Math.tan(ang)); ctx.lineTo(-1200, -1200 * Math.tan(ang)); }
        else { ctx.moveTo(-1200, 1200); ctx.lineTo(1200, 1200); ctx.lineTo(1200, 1200 * Math.tan(ang)); ctx.lineTo(-1200, -1200 * Math.tan(ang)); }
        ctx.closePath(); ctx.clip(); ctx.translate(side * nx * sep + side * sep * .6, side * ny * sep);
        txt(word, 0, 0, { size: 340, color: col }); ctx.restore();
      }
      if (cut > 0 && cut < 1 || bump(t, 45.3, .25) > 0) { ctx.save(); ctx.rotate(ang); ctx.fillStyle = '#fff';
        const len = 1300 * E.out3(cut), a = 1 - P(t, 45.35, 45.6); ctx.globalAlpha = a; ctx.fillRect(-650, -3, len, 6); ctx.restore(); }
      crab({ x: lerp(-1100, 1100, E.io3(P(t, 45.0, 45.5))), y: 300, s: .35, arm: snip(t, [45.25], .6), leg: t * 30, legAmp: 10, color: '#04140f' });
    } else {
      glitchTxt(word, 0, 0, { size: 340, color: col }, 14 * (1 - p));
    }
    ctx.restore();
    return;
  }
  // ---- lockup
  bg(t, 960, 500, '61,214,176', .16 + .04 * beatPulse(t, .5, 8) * (t < 50), .05);
  for (const d of DUST) { const y = (d.y - (t - 47) * d.v * 4 + H * 4) % H, a = .15 + .25 * Math.sin(t * 2 + d.ph) ** 2;
    ctx.fillStyle = `rgba(61,214,176,${a})`; ctx.fillRect(d.x + Math.sin(t + d.ph) * 20, y, d.s, d.s); }
  const asm = E.out3(P(t, 47, 47.8)), cx = 640;
  crab({ x: cx, y: 470, s: 1.0, assemble: asm, arm: snip(t, [47.85, 50.0, 50.3], .35) + .05 * beatPulse(t, .5, 8) * (t < 50), blink: blinkAt(t, [49.4, 51.0]), glow: asm >= 1 ? .7 : 0 });
  const rv = E.io3(P(t, 47.5, 48.1));
  ctx.save(); ctx.beginPath(); ctx.rect(830, 300, 1000 * rv, 260); ctx.clip();
  glitchTxt('SNIPY', 830 + (1 - rv) * -200, 440, { size: 230, align: 'left', ls: 24 }, 2 + 6 * bump(t, 50, .3));
  ctx.restore();
  const tg = E.out3(P(t, 48.1, 48.5));
  txt('Highlight it. It\'s copied.', 838, 600 + (1 - tg) * 30, { size: 50, weight: 500, color: C.teal, align: 'left', alpha: tg });
  const ft = P(t, 48.6, 49.1);
  ctx.save(); ctx.globalAlpha = ft; const items = ['Rust', 'Windows', 'v0.1.0', 'by JM2101']; let x = 960 - (items.join('').length * 15.6 + 3 * 60) / 2;
  items.forEach((s, i) => { txt(s, x, 880, { size: 26, font: MONO, weight: 400, color: C.dim, align: 'left' }); x += s.length * 15.6 + 30;
    if (i < 3) { ctx.fillStyle = C.teal; ctx.fillRect(x - 4, 876, 8, 8); x += 30; } });
  ctx.restore();
}

// ---------- master ----------
function render(T, frame = Math.round(T * 60)) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none';
  const [sx, sy] = shake(T); ctx.save(); ctx.translate(sx, sy);
  if (T < 6) s1(T); else if (T < 14) s2(T); else if (T < 26) s3(T); else if (T < 36) s4(T); else if (T < 44) s5(T); else s6(T);
  ctx.restore();
  post(T, frame);
}

const ready = Promise.all([document.fonts.load(`700 100px "Space Grotesk"`), document.fonts.load(`500 100px "Space Grotesk"`),
  document.fonts.load(`400 30px "JetBrains Mono"`), document.fonts.load(`700 30px "JetBrains Mono"`)]).then(() => document.fonts.ready);
window.renderAt = (T, f) => render(T, f);
window.READY = ready.then(() => true);

const params = new URLSearchParams(location.search);
if (params.has('render')) document.body.classList.add('render');
else ready.then(() => {
  const audio = document.getElementById('music'), startAt = parseFloat(params.get('t') || '0');
  render(startAt);
  let playing = false, t0 = 0;
  const now = () => audio.duration && !audio.paused ? audio.currentTime : (performance.now() - t0) / 1000;
  const loop = () => { if (!playing) return; const T = now(); if (T >= DUR) { playing = false; document.getElementById('play').style.display = 'grid'; return; }
    render(T); requestAnimationFrame(loop); };
  const start = () => { document.getElementById('play').style.display = 'none'; audio.currentTime = startAt; t0 = performance.now() - startAt * 1000;
    audio.play().catch(() => {}); playing = true; loop(); };
  document.getElementById('play').addEventListener('click', start);
  addEventListener('keydown', e => { if (e.code === 'Space') { if (playing) { playing = false; audio.pause(); } else start(); } });
});
</script>
